# Serves the built frontend and proxies the API to the backend container (Docker Compose).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # In line with the backend request-size limit (spring.servlet.multipart.max-request-size).
    client_max_body_size 2m;

    # Repository-derived text is untrusted; the CSP blocks inline and third-party scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html so deep links and refreshes work.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
