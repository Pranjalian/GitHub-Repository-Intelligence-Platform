# Railway config-as-code for the backend service. See docs/deployment-plan.md (section 3).
# In the service settings set Root Directory to /backend and Config-as-code path to /backend/railway.toml.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Only backend and database changes rebuild this service.
watchPatterns = ["/backend/**", "/db/**"]

[deploy]
healthcheckPath = "/actuator/health"
# JVM start plus Flyway migrations; the Dockerfile's own HEALTHCHECK is ignored by Railway.
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Must stay 1: AI call budgets, login throttling, sessions and the job pool are in memory.
numReplicas = 1
