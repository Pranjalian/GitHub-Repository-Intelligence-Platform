# Secret detection rules for GenericSecretScanAnalyzer. Data-driven: adding a rule needs no Java change.
#
# Fields
#   id          unique rule id (used as the finding rule id)
#   title       what was found, in words (never contains the value)
#   regex       Java regex applied per line; the secret is capture group `secret` if present, else group 1, else the whole match
#   keywords    optional cheap pre-filter: the line must contain one of these (case-insensitive)
#   entropy     optional minimum Shannon entropy (bits per character) of the secret value
#   globs       optional path globs; the rule only runs on matching files (Ant style, forward slashes)
#   severity    CRITICAL | HIGH | MEDIUM | LOW
#   confidence  LIKELY | POSSIBLE
#
# Placeholders (changeme, example values, ${...}, xxx, ...) are skipped by the global allowlist below.

allowlist:
  # a captured value matching any of these is a placeholder, not a secret
  value-patterns:
    - '(?i)^(change[-_ ]?me|changeit|replace[-_ ]?me|placeholder|dummy|example|sample|your[-_ ]?.*|my[-_ ]?(secret|password|token).*|todo|tbd|none|null|true|false|redacted)$'
    - '(?i)^x{3,}.*$'
    - '^\*{3,}$'
    - '^\$\{.*\}$'
    - '^\{\{.*\}\}$'
    - '^<.*>$'
    - '^%\(.*\)s$'
    - '(?i)^(password|secret|token|passwd|pwd)$'
  # a whole line containing one of these is documentation of a placeholder
  line-markers:
    - 'EXAMPLE'
    - 'example.com'

rules:

  - id: private-key
    title: Private key block
    regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'
    keywords: ['PRIVATE KEY']
    severity: CRITICAL
    confidence: LIKELY

  - id: aws-access-key-id
    title: AWS access key id
    regex: '\b((?:AKIA|ASIA)[0-9A-Z]{16})\b'
    keywords: ['AKIA', 'ASIA']
    severity: HIGH
    confidence: LIKELY

  - id: aws-secret-access-key
    title: AWS secret access key assignment
    regex: '(?i)aws_?secret_?access_?key["'']?\s*[:=]\s*["'']?([A-Za-z0-9/+=]{40})["'']?'
    keywords: ['secret_access_key', 'secretaccesskey']
    entropy: 3.5
    severity: HIGH
    confidence: LIKELY

  - id: github-token
    title: GitHub token
    regex: '\b(gh[pousr]_[A-Za-z0-9]{36,255})\b'
    keywords: ['ghp_', 'gho_', 'ghu_', 'ghs_', 'ghr_']
    severity: HIGH
    confidence: LIKELY

  - id: github-fine-grained-token
    title: GitHub fine-grained personal access token
    regex: '\b(github_pat_[A-Za-z0-9_]{22,255})\b'
    keywords: ['github_pat_']
    severity: HIGH
    confidence: LIKELY

  - id: slack-token
    title: Slack token
    regex: '\b(xox[baprs]-[A-Za-z0-9-]{10,})\b'
    keywords: ['xox']
    severity: HIGH
    confidence: LIKELY

  - id: stripe-api-key
    title: Stripe API key
    regex: '\b((?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,})\b'
    keywords: ['sk_', 'rk_']
    severity: HIGH
    confidence: LIKELY

  - id: google-api-key
    title: Google API key
    regex: '\b(AIza[0-9A-Za-z_-]{35})\b'
    keywords: ['AIza']
    severity: MEDIUM
    confidence: LIKELY

  - id: jwt
    title: JSON Web Token
    regex: '\b(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})\b'
    keywords: ['eyJ']
    severity: MEDIUM
    confidence: POSSIBLE

  - id: generic-quoted-credential
    title: Hard-coded credential in an assignment
    regex: '(?i)\b(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|access[_-]?key|client[_-]?secret|private[_-]?key)\b["'']?\s*[:=]\s*["'']([^"''\s]{8,})["'']'
    keywords: ['password', 'passwd', 'pwd', 'secret', 'token', 'api_key', 'api-key', 'apikey', 'access_key', 'access-key', 'private_key', 'private-key']
    entropy: 3.0
    severity: MEDIUM
    confidence: POSSIBLE

  - id: config-file-credential
    title: Credential value in a configuration file
    regex: '(?i)^\s*[A-Za-z0-9_.-]*(?:password|passwd|secret|token|api[_-]?key|access[_-]?key)[A-Za-z0-9_.-]*\s*[:=]\s*([^\s"''#]{8,})\s*$'
    keywords: ['password', 'passwd', 'secret', 'token', 'api_key', 'api-key', 'apikey', 'access_key', 'access-key']
    globs: ['**/*.properties', '**/*.env', '**/.env', '**/.env.*', '**/*.yml', '**/*.yaml', '**/*.ini', '**/*.cfg', '**/*.conf']
    entropy: 3.0
    severity: MEDIUM
    confidence: POSSIBLE
