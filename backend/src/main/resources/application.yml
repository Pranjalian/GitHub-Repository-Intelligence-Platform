spring:
  application:
    name: repo-intelligence
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repointelligence}
    username: ${DB_USERNAME:repointel}
    password: ${DB_PASSWORD:repointel_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate:
        # Bulk inserts of file records and findings are batched.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 1MB
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

analysis:
  jobs:
    # Set to false to stop queued runs from starting automatically.
    enabled: true
    max-concurrent-jobs: 2
    queue-capacity: 100
    # Time budget for one run, ingestion included. Analyzers still running at the deadline are stopped.
    max-analysis-duration: PT15M
  vulnerabilities:
    osv:
      # Known-vulnerability lookup via OSV.dev. Off by default: it needs outbound network access.
      # Only package names and versions are sent, never source code. When off, dependencies are
      # shown as "Not checked", never as free of vulnerabilities.
      enabled: false
      endpoint: https://api.osv.dev
      # Outbound allowlist for the lookup (only used when enabled).
      allowed-hosts: [api.osv.dev]
      timeout: PT10S
      max-retries: 2
  results:
    # Longest string kept in finding evidence; longer text is truncated (after redaction).
    max-excerpt-length: 500
    # Findings stored per analyzer; the rest are dropped and the execution records it.
    max-findings-per-analyzer: 5000

repository:
  ingestion:
    # Pre-check against the size GitHub reports; repositories clearly over this are rejected (422).
    max-repository-size-mb: 200
    # Compressed archive size; the download aborts as soon as it is exceeded.
    max-tarball-size-mb: 200
    # Total decompressed size of the archive (decompression-bomb guard).
    max-extracted-size-mb: 500
    # Larger files are catalogued but not extracted.
    max-file-size-kb: 1024
    # Catalogued files; the archive entry count is capped at ten times this.
    max-file-count: 20000
    excluded-directories: [.git, node_modules, target, build, dist, .gradle, vendor, __pycache__, .idea, .vscode, .venv]
    # Stay extracted even inside an excluded directory: analyzer inputs such as JaCoCo reports.
    excluded-exceptions: ["**/jacoco*.xml", "**/jacoco/*.xml"]
  workspace:
    # Where snapshots are extracted (one directory per snapshot).
    root: ${WORKSPACE_ROOT:./.workspace}
    # Keep a workspace this long after its run ends; PT0S deletes it immediately.
    retain-after-analysis: PT0S
    # How often orphaned workspaces are swept (also swept once at startup).
    sweep-interval: PT1H
  submission:
    # Cap on queued + running analysis jobs; further new submissions get 429.
    max-pending-jobs: 10
    # Token bucket on POST /api/v1/repositories/analyze.
    rate-limit:
      capacity: 10
      refill-period: PT1M

github:
  api-base-url: https://api.github.com
  # Optional but strongly recommended: raises the API limit from 60 to 5,000 requests/hour.
  # Use a fine-grained token with read-only access to public repositories. Never logged.
  token: ${GITHUB_TOKEN:}
  api-version: "2022-11-28"
  connect-timeout: PT5S
  read-timeout: PT30S
  # Outbound allowlist for the API host and every redirect hop.
  allowed-hosts: [api.github.com, codeload.github.com]
  retry:
    max-attempts: 3
    initial-backoff: PT0.5S
    max-backoff: PT5S

app:
  api:
    title: GitHub Repository Intelligence Platform
    version: 0.0.1
    description: Deterministic analysis of public GitHub repositories.

ai:
  # Optional AI explanations (MVP 3). Off by default: the application is fully functional without AI,
  # and with ai.enabled=false no provider client is created and nothing is sent anywhere.
  enabled: ${AI_ENABLED:false}
  # Provider used unless the request (preferred provider) or a feature route names another.
  default-provider: ${AI_DEFAULT_PROVIDER:ollama}
  # Tried in order when the selected provider is unavailable. A hosted provider is only ever used when
  # its data-handling-acknowledged is true, so a local provider is never silently replaced by a hosted one.
  fallback-providers: []
  # Per-feature routing, e.g. a small local model for simple summaries:
  #   features:
  #     summarize-module: { provider: ollama, model: llama3.2:3b }
  features: {}
  providers:
    ollama:
      # Local models; nothing leaves the machine. Needs a running Ollama with the model pulled.
      enabled: ${AI_PROVIDERS_OLLAMA_ENABLED:false}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat-model: ${OLLAMA_CHAT_MODEL:}
      allowed-hosts: [localhost, 127.0.0.1, host.docker.internal, ollama]
      # context window of the model, if you want the prompt budget capped by it
      max-context-tokens:
    gemini:
      # Hosted. Verify the provider's current terms, quotas and data use before enabling it.
      enabled: ${AI_PROVIDERS_GEMINI_ENABLED:false}
      base-url: https://generativelanguage.googleapis.com
      api-key: ${GEMINI_API_KEY:}
      chat-model: ${GEMINI_CHAT_MODEL:}
      # Must be true before any repository excerpt is sent to this provider.
      data-handling-acknowledged: ${AI_PROVIDERS_GEMINI_DATA_HANDLING_ACKNOWLEDGED:false}
      allowed-hosts: [generativelanguage.googleapis.com]
      # Sent as generationConfig.thinkingConfig.thinkingLevel. Thinking tokens count against max-output-tokens
      # and add latency; "low" keeps answers fast and complete. Empty: not sent (for models that reject it).
      thinking-level: ${GEMINI_THINKING_LEVEL:low}
      # Optional pricing (per million tokens). Cost is only shown when both are set; it is never invented.
      input-price-per-million-tokens:
      output-price-per-million-tokens:
      currency: USD
    openrouter:
      # Hosted. Model availability, prices and free tiers change; nothing assumes a model is free.
      enabled: ${AI_PROVIDERS_OPENROUTER_ENABLED:false}
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY:}
      chat-model: ${OPENROUTER_CHAT_MODEL:}
      data-handling-acknowledged: ${AI_PROVIDERS_OPENROUTER_DATA_HANDLING_ACKNOWLEDGED:false}
      allowed-hosts: [openrouter.ai]
      input-price-per-million-tokens:
      output-price-per-million-tokens:
      currency: USD
  limits:
    max-input-tokens: 12000
    # Upper bound for the visible answer; each prompt template has its own lower limit and the smaller applies.
    # Thinking models (Gemini) get a separate thinking allowance on top in the adapter.
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1500}
    # Provider calls per analysis run of a snapshot; cache hits do not count.
    max-calls-per-analysis: ${AI_MAX_CALLS_PER_ANALYSIS:10}
    # Per HTTP attempt. Keep well below the frontend nginx proxy_read_timeout (120 s): the insight request
    # waits for the provider, and evidence collection and one 5xx retry come on top.
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    # Retries after a connection error or 5xx only; timeouts and rate limits are never retried.
    max-retries: 1
  cache:
    enabled: true
    ttl: P7D
  token-estimate:
    # Used when a provider does not report token usage; such counts are labelled ESTIMATED.
    chars-per-token: 4
  source:
    # When the extracted source was already deleted (the default after analysis), rebuild it once from the
    # commit's tarball (one GitHub download) so an insight can include the code. false: parser facts only.
    allow-download: true
    # Longest source excerpt for one class or method.
    max-lines: 400
  health-cache-ttl: PT30S
  # How long a rate-limited provider is skipped when it gives no reset time.
  rate-limit-cooldown: PT60S
  allow-hosted-for-private-repositories: false
  # Optional link to your setup guide, shown in the UI when AI is unavailable (the README section "AI insights").
  setup-guide-url:
