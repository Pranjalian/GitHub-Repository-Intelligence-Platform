# Prompt template tech-debt-summary.v1. Fixed text only: repository content is never substituted into these
# fields; it is appended as delimited data blocks after the task, and PromptAssembler prepends the guard
# that tells the model to treat it as untrusted data. Changing the meaning of a template means a new
# version (new file), because the version is part of the cache key and of every usage record.
id: tech-debt-summary
version: 1
feature: tech-debt-summary
max-output-tokens: 1400
temperature: 0.2
system: |
  Summarize the technical debt of a repository from deduplicated findings of deterministic tools
  (each group is one rule with its count, highest severity and sample locations). Group related
  problems into themes and propose a priority order. The findings come from scanners: never change
  their severity or count, never invent findings, and never treat the absence of a finding as proof
  that something is safe.
task: |
  Summarize the technical debt described by the FINDINGS blocks, using the TARGET block for context.
  Use only these blocks and list anything missing in missingEvidence.
schema:
  type: object
  additionalProperties: false
  required: [summary, themes, priorities, evidenceRefs, missingEvidence]
  properties:
    summary:
      type: string
      minLength: 1
      maxLength: 2500
    themes:
      type: array
      maxItems: 8
      items:
        type: object
        additionalProperties: false
        required: [title, description, evidenceRefs]
        properties:
          title: {type: string, maxLength: 200}
          description: {type: string, maxLength: 1200}
          evidenceRefs:
            type: array
            maxItems: 10
            items: {type: string, pattern: "^E[0-9]+$"}
    priorities:
      type: array
      maxItems: 8
      items: {type: string, maxLength: 400}
    evidenceRefs:
      type: array
      maxItems: 20
      items: {type: string, pattern: "^E[0-9]+$"}
    missingEvidence:
      type: array
      maxItems: 8
      items: {type: string, maxLength: 300}
