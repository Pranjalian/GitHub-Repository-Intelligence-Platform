# Retrieval evaluation set (MVP 4, Step 4.2): questions about the spring-boot-architecture fixture and the
# files that hold the answer. RetrievalEvaluationTests indexes the fixture, retrieves the top k chunks per
# question and computes, per retrieval mode:
#   recall@k: share of a question's expected files that appear among the top k chunks (averaged)
#   MRR:      1 / rank of the first chunk from an expected file (0 when none is in the top k), averaged
# Retrieval quality is measured here, separately from answer quality (no model is involved).
# The thresholds are the agreed baseline: the values measured when this set was created, rounded down.
# A change that lowers a metric below its threshold fails the build; raise a threshold when retrieval improves.
fixture: spring-boot-architecture
k: 5
# Measured 2026-11-22 (MVP 4): keyword-symbol recall@5 0.833, MRR 0.722; semantic (hashing stand-in) 0.528 /
# 0.461; hybrid 0.750 / 0.597. Thresholds are those values rounded down to the next 0.05.
thresholds:
  keyword-symbol: {recall: 0.80, mrr: 0.70}
  semantic: {recall: 0.50, mrr: 0.45}
  hybrid: {recall: 0.75, mrr: 0.55}
questions:
  - id: create-order
    question: How is a new order created and its total calculated?
    expected: [src/main/java/com/example/shop/service/OrderService.java]
  - id: discounts
    question: Which discount policies are applied to the order total?
    expected:
      - src/main/java/com/example/shop/service/DiscountPolicy.java
      - src/main/java/com/example/shop/service/SeasonalDiscount.java
      - src/main/java/com/example/shop/service/LoyaltyDiscount.java
  - id: endpoints
    question: Which REST endpoints does the OrderController expose?
    expected: [src/main/java/com/example/shop/web/OrderController.java]
  - id: notifications
    question: How are notifications sent by email or sms?
    expected:
      - src/main/java/com/example/shop/service/NotifierProvider.java
      - src/main/java/com/example/shop/service/EmailNotifier.java
      - src/main/java/com/example/shop/service/SmsNotifier.java
  - id: refund
    question: How does the legacy payment bridge refund a payment?
    expected: [src/main/java/com/example/shop/service/LegacyPaymentBridge.java]
  - id: customer-repository
    question: Where are customers loaded from the database?
    expected: [src/main/java/com/example/shop/repository/CustomerRepository.java]
  - id: id-generation
    question: How are new ids generated?
    expected: [src/main/java/com/example/shop/support/IdGenerator.java]
  - id: audit-cycle
    question: How do AuditService and ReportService depend on each other?
    expected:
      - src/main/java/com/example/shop/service/AuditService.java
      - src/main/java/com/example/shop/service/ReportService.java
  - id: order-entity
    question: How is an Order related to its customer and order lines?
    expected: [src/main/java/com/example/shop/domain/Order.java]
  - id: api-paths
    question: Where is the base path of the orders API defined?
    expected: [src/main/java/com/example/shop/web/ApiPaths.java]
  - id: price
    question: How is the price calculated from the quantity?
    expected: [src/main/java/com/example/shop/service/PriceCalculator.java]
  - id: tests
    question: Which tests cover the OrderService?
    expected: [src/test/java/com/example/shop/OrderServiceTests.java]
