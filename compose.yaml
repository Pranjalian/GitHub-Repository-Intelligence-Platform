# Run the full application locally: docker compose up --build
# UI: http://localhost:5173   API: http://localhost:8080   Swagger: http://localhost:8080/swagger-ui.html
#
# Values come from the shell or from a root .env file (copy .env.example). There is no authentication,
# so every port is bound to 127.0.0.1 only: do not expose these services to a network.
# Database only (for `mvnw spring-boot:run` + `pnpm dev`): docker compose up -d postgres

name: repo-intelligence

services:
  postgres:
    # postgres:16-alpine plus the pgvector extension (semantic search, MVP 4); see db/Dockerfile.
    build: ./db
    image: repo-intelligence-postgres:local
    environment:
      POSTGRES_DB: repointelligence
      POSTGRES_USER: ${DB_USERNAME:-repointel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-repointel_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d repointelligence"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    image: repo-intelligence-backend:local
    init: true # reaps child processes (Semgrep) when they are killed on deadline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DB_URL is fixed here: the localhost value in .env is only for runs outside Docker.
      DB_URL: jdbc:postgresql://postgres:5432/repointelligence
      DB_USERNAME: ${DB_USERNAME:-repointel}
      DB_PASSWORD: ${DB_PASSWORD:-repointel_dev}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WORKSPACE_ROOT: /workspace
      ANALYSIS_VULNERABILITIES_OSV_ENABLED: ${ANALYSIS_VULNERABILITIES_OSV_ENABLED:-false}
      ANALYSIS_ANALYZERS_JAVA_CODE_ANALYZER_OPTIONS_INCLUDE_TESTS: ${ANALYSIS_ANALYZERS_JAVA_CODE_ANALYZER_OPTIONS_INCLUDE_TESTS:-false}
      REPOSITORY_INGESTION_MAX_REPOSITORY_SIZE_MB: ${REPOSITORY_INGESTION_MAX_REPOSITORY_SIZE_MB:-200}
      ANALYSIS_JOBS_MAX_ANALYSIS_DURATION: ${ANALYSIS_JOBS_MAX_ANALYSIS_DURATION:-PT15M}
      # Optional AI insights (MVP 3); all off by default. See README "AI insights (optional)".
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-gemini}
      AI_MAX_CALLS_PER_ANALYSIS: ${AI_MAX_CALLS_PER_ANALYSIS:-10}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1500}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_PROVIDERS_OLLAMA_ENABLED: ${AI_PROVIDERS_OLLAMA_ENABLED:-false}
      # Ollama running on the host machine, reached from the container
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      # Embedding model for semantic search (MVP 4), e.g. nomic-embed-text; separate from the chat model.
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-ollama}
      AI_PROVIDERS_GEMINI_ENABLED: ${AI_PROVIDERS_GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}
      # "-" not ":-": an explicitly empty GEMINI_THINKING_LEVEL stays empty and turns the setting off
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL-low}
      AI_PROVIDERS_GEMINI_DATA_HANDLING_ACKNOWLEDGED: ${AI_PROVIDERS_GEMINI_DATA_HANDLING_ACKNOWLEDGED:-false}
      AI_PROVIDERS_OPENROUTER_ENABLED: ${AI_PROVIDERS_OPENROUTER_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-}
      AI_PROVIDERS_OPENROUTER_DATA_HANDLING_ACKNOWLEDGED: ${AI_PROVIDERS_OPENROUTER_DATA_HANDLING_ACKNOWLEDGED:-false}
      # Search index and Q&A (MVP 4); keyword and symbol search need no AI.
      RAG_VECTOR_STORE: ${RAG_VECTOR_STORE:-auto}
      RAG_MAX_QUESTIONS_PER_SNAPSHOT: ${RAG_MAX_QUESTIONS_PER_SNAPSHOT:-50}
      # Change-impact analysis (MVP 5); it reads the stored dependency graph and needs no AI.
      IMPACT_DEFAULT_DEPTH: ${IMPACT_DEFAULT_DEPTH:-3}
      IMPACT_MAX_DEPTH: ${IMPACT_MAX_DEPTH:-6}
    extra_hosts:
      # lets the backend reach an Ollama on the host on Linux too (Docker Desktop has this built in)
      - "host.docker.internal:host-gateway"
    volumes:
      - workspace:/workspace
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: repo-intelligence-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
  workspace:
